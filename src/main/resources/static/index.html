<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Tracker</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; }
  button { width: 100%; padding: 16px; font-size: 18px; margin: 8px 0; border-radius: 8px; border: none; }
  .primary { background: #2563eb; color: white; }
  .danger { background: #dc2626; color: white; }
  select, input { width: 100%; padding: 10px; font-size: 16px; margin: 4px 0; }
  #status { padding: 12px; background: #f1f5f9; border-radius: 8px; margin: 12px 0; }
  h3 { margin-top: 32px; }
</style>
</head>
<body>

<h2>Time & Mileage Tracker</h2>
<div id="status">Loading...</div>

<select id="storeSelect"></select>
<button class="primary" onclick="clockIn()">Clock In (at this store)</button>
<button class="primary" onclick="logVisit()">I'm at this store</button>
<button class="danger" onclick="clockOut()">Clock Out (at this store)</button>

<h3>Add a store</h3>
<input id="newStoreName" placeholder="Store name">
<button onclick="addStore()">Add store</button>

<h3>Set distance between two stores</h3>
<select id="distA"></select>
<select id="distB"></select>
<input id="distMiles" type="number" step="0.1" placeholder="Miles">
<button onclick="addDistance()">Save distance</button>

<h3>Two-week report</h3>
<input id="startDate" type="date">
<input id="endDate" type="date">
<button onclick="downloadReport()">Download CSV</button>

<script>
let currentShift = null;

async function loadStores() {
  const res = await fetch('/api/stores');
  const stores = await res.json();
  const opts = stores.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  document.getElementById('storeSelect').innerHTML = opts;
  document.getElementById('distA').innerHTML = opts;
  document.getElementById('distB').innerHTML = opts;
}

async function loadStatus() {
  const res = await fetch('/api/shifts/current');
  if (res.status === 204) {
    currentShift = null;
    document.getElementById('status').textContent = 'Not currently clocked in.';
  } else {
    currentShift = await res.json();
    document.getElementById('status').textContent =
      'Clocked in since ' + new Date(currentShift.clockInTime).toLocaleTimeString();
  }
}

async function clockIn() {
  const storeId = document.getElementById('storeSelect').value;
  await fetch(`/api/shifts/clock-in?storeId=${storeId}`, { method: 'POST' });
  await loadStatus();
}

async function logVisit() {
  if (!currentShift) return alert('Clock in first.');
  const storeId = document.getElementById('storeSelect').value;
  await fetch(`/api/shifts/${currentShift.id}/visit?storeId=${storeId}`, { method: 'POST' });
  alert('Logged.');
}

async function clockOut() {
  if (!currentShift) return alert('Clock in first.');
  const storeId = document.getElementById('storeSelect').value;
  await fetch(`/api/shifts/${currentShift.id}/clock-out?storeId=${storeId}`, { method: 'POST' });
  await loadStatus();
}

async function addStore() {
  const name = document.getElementById('newStoreName').value;
  if (!name) return;
  await fetch('/api/stores', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  document.getElementById('newStoreName').value = '';
  await loadStores();
}

async function addDistance() {
  const storeAId = document.getElementById('distA').value;
  const storeBId = document.getElementById('distB').value;
  const miles = document.getElementById('distMiles').value;
  await fetch('/api/distances', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ storeAId, storeBId, miles })
  });
  alert('Distance saved.');
}

function downloadReport() {
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;
  if (!start || !end) return alert('Pick both dates.');
  window.location.href = `/api/reports/csv?start=${start}&end=${end}`;
}

loadStores();
loadStatus();
</script>
</body>
</html>
